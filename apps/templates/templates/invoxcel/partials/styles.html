<style>
  :root {
    --color-primary: #217346;
    --color-canvas: #F3F6F4;
    --color-surface: #FFFFFF;
    --color-text: #1F2D25;
    --color-secondary: #5B6961;
    --color-attention: #8A5A12;
    --color-line: color-mix(in srgb, var(--color-secondary) 21%, var(--color-surface));
    --color-soft: color-mix(in srgb, var(--color-primary) 7%, var(--color-surface));
    --color-warning-soft: color-mix(in srgb, var(--color-attention) 8%, var(--color-surface));
    --color-primary-hover: color-mix(in srgb, var(--color-primary) 83%, var(--color-text));
    --shadow-paper: 0 3px 12px color-mix(in srgb, var(--color-text) 7%, transparent);
    --font-ui: "Avenir Next", "Segoe UI", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 105px; }
  body { margin: 0; color: var(--color-text); background: var(--color-surface); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  a { color: inherit; text-decoration: none; }
  button, input, select, textarea { font: inherit; }
  button, summary, select { cursor: pointer; }
  button { color: inherit; }
  button, input, select, textarea { -webkit-tap-highlight-color: transparent; }
  button { border: 0; background: none; }
  a, button, input, select, textarea, summary, [tabindex] { outline-offset: 4px; }
  :focus-visible { outline: 3px solid var(--color-primary); }
  h1, h2, h3, h4, p { margin: 0; }
  h1, h2, h3, h4 { font-weight: 650; }
  p { color: var(--color-secondary); }
  h1 { line-height: 1.12; letter-spacing: -.045em; }
  h2 { line-height: 1.25; letter-spacing: -.025em; }
  .icon-library { position: absolute; width: 0; height: 0; overflow: hidden; }
  .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; vertical-align: middle; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .skip-link { position: fixed; top: -100px; left: 16px; z-index: 100; padding: 12px 20px; background: var(--color-primary); color: var(--color-surface); }
  .skip-link:focus { top: 12px; }
  .page-width { width: min(1240px, calc(100% - 112px)); margin-inline: auto; }
  .small { font-size: 13px; }
  .muted { color: var(--color-secondary); }
  .green { color: var(--color-primary); }
  .attention { color: var(--color-attention); }
  .numeric { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .text-link { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0; font-weight: 600; color: var(--color-primary); }
  .text-link:hover { text-decoration: underline; text-underline-offset: 4px; }
  .button { min-height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; border-radius: 7px; padding: 11px 19px; border: 1px solid transparent; font-size: 14px; font-weight: 600; line-height: 1.4; white-space: nowrap; }
  .button-primary { background: var(--color-primary); color: var(--color-surface); }
  .button-primary:hover { background: var(--color-primary-hover); }
  .button-outline { background: var(--color-surface); border-color: var(--color-line); }
  .button-outline:hover { border-color: var(--color-primary); color: var(--color-primary); }
  .button-small { min-height: 40px; padding: 8px 15px; }
  .button-full { width: 100%; }
  .icon-button { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 6px; flex-shrink: 0; color: var(--color-secondary); }
  .icon-button:hover { background: var(--color-soft); color: var(--color-primary); }
  .site-header { height: 88px; padding: 0 4%; display: flex; align-items: center; justify-content: space-between; gap: 24px; border-bottom: 1px solid var(--color-line); position: sticky; top: 0; z-index: 20; background: var(--color-surface); }
  .brand { display: flex; gap: 9px; align-items: center; font-size: 25px; font-weight: 750; letter-spacing: -.9px; }
  .brand-mark { width: 37px; height: 37px; color: var(--color-primary); }
  .brand-mark svg { display: block; width: 100%; height: 100%; }
  .public-nav { display: flex; align-items: center; gap: 34px; font-size: 14px; font-weight: 550; color: var(--color-secondary); }
  .public-nav a { padding-block: 12px; }
  .public-nav a:hover, .public-nav a[aria-current] { color: var(--color-primary); }
  .flow-nav { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--color-secondary); }
  .flow-nav a { display: flex; align-items: center; gap: 8px; padding: 8px 0; }

  .flow-nav a[aria-current] { color: var(--color-primary); font-weight: 650; }
  .flow-nav a[aria-current] > span { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-surface); }
  .step-line { height: 1px; width: 28px; background: var(--color-line); }
  input:not([type="checkbox"]), select, textarea { min-height: 44px; padding: 10px 12px; border: 1px solid var(--color-line); border-radius: 6px; background: var(--color-surface); color: var(--color-text); min-width: 0; }

  .upload-illustration svg path:last-child { fill: none; }
